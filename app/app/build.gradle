#!/usr/bin/env bash
# kaliterm_all_in_one.sh
# RODE ISSO NO TERMUX (ou NetHunter). Comando único:
#   bash kaliterm_all_in_one.sh
#
# Ele faz TUDO sozinho: instala o necessário, baixa o Termux, troca nome/cores/
# ícone/prompt para estilo Kali, e deixa pronto pra build na nuvem (GitHub Actions).
# No final, só sobra 3 passos manuais (criar repositório no GitHub e enviar).
set -euo pipefail

APP_NAME="KaliTerm"
PKG_OLD="com.termux"
PKG_NEW="com.kaliterm.app"
WORKDIR="$HOME/kaliterm-build"
BG_COLOR="#0C0C0C"
FG_COLOR="#00FF41"

echo "########################################"
echo "# 1/6 - Instalando git..."
echo "########################################"
if command -v git >/dev/null 2>&1; then
  echo "    git já está instalado."
elif command -v apt >/dev/null 2>&1; then
  # Estamos no chroot do Kali (ou Debian/Ubuntu)
  (sudo apt update -y && sudo apt install -y git) 2>/dev/null || \
    (apt update -y && apt install -y git)
elif command -v pkg >/dev/null 2>&1; then
  # Estamos no Termux puro
  pkg install -y git
else
  echo "ERRO: não achei 'apt' nem 'pkg' nem 'git' já instalado. Ambiente não reconhecido."
  exit 1
fi

echo "########################################"
echo "# 2/6 - Baixando código-fonte do Termux..."
echo "########################################"
rm -rf "$WORKDIR"
mkdir -p "$WORKDIR"
cd "$WORKDIR"
git clone --depth=1 https://github.com/termux/termux-app.git app
cd app

echo "########################################"
echo "# 3/6 - Trocando nome e identidade do app..."
echo "########################################"
find . -type d -path "*${PKG_OLD//./\/}*" | while read -r dir; do
  newdir=$(echo "$dir" | sed "s#${PKG_OLD//./\/}#${PKG_NEW//./\/}#")
  mkdir -p "$(dirname "$newdir")"
  mv "$dir" "$newdir" 2>/dev/null || true
done
grep -rlZ "$PKG_OLD" --include=*.java --include=*.kt --include=*.xml --include=*.gradle --include=*.pro . 2>/dev/null \
  | xargs -0 -r sed -i "s/${PKG_OLD//./\.}/${PKG_NEW}/g" || true
find . -name "strings.xml" | xargs -r sed -i \
  "s#<string name=\"application_name\">.*</string>#<string name=\"application_name\">${APP_NAME}</string>#"

echo "########################################"
echo "# 4/6 - Aplicando cores, prompt e ícone estilo Kali..."
echo "########################################"
COLORS_FILE=$(find . -path "*res/values/colors.xml" | head -n1)
if [ -n "$COLORS_FILE" ]; then
  sed -i "s#<color name=\"background\">.*</color>#<color name=\"background\">${BG_COLOR}</color>#" "$COLORS_FILE" || true
  sed -i "s#<color name=\"foreground\">.*</color>#<color name=\"foreground\">${FG_COLOR}</color>#" "$COLORS_FILE" || true
fi

mkdir -p app/src/main/assets/termux-custom
cat > app/src/main/assets/termux-custom/bashrc_append.sh <<'EOF'
export PS1='\[\033[01;32m\]root@kali\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]# '
EOF

# Ícone embutido direto aqui dentro (não precisa de arquivo separado)
mkdir -p app/src/main/ic_kaliterm
cat > app/src/main/ic_kaliterm/icon.svg <<'EOF'
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00B84D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="92" fill="none" stroke="#00FF66" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M120 180 L230 256 L120 332" fill="none" stroke="url(#glow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260" y="312" width="140" height="30" rx="6" fill="url(#glow)"/>
</svg>
EOF

echo "########################################"
echo "# 5/6 - Preparando build automático na nuvem (GitHub Actions)..."
echo "########################################"
mkdir -p "$WORKDIR/.github/workflows"
cat > "$WORKDIR/.github/workflows/build.yml" <<'EOF'
name: Build KaliTerm APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar ImageMagick e gerar ícones
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          ICON=app/app/src/main/ic_kaliterm/icon.svg
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            mkdir -p "app/app/src/main/res/mipmap-$d"
            convert -background none -resize "${SIZES[$d]}x${SIZES[$d]}" "$ICON" "app/app/src/main/res/mipmap-$d/ic_launcher.png"
            convert -background none -resize "${SIZES[$d]}x${SIZES[$d]}" "$ICON" "app/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
      - name: Build APK
        working-directory: ./app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KaliTerm-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
EOF

echo "########################################"
echo "# 6/6 - Preparando repositório Git local..."
echo "########################################"
cd "$WORKDIR"
git init -b main
git add -A
git commit -m "KaliTerm: fork rebrandado do Termux com icone e cores Kali" >/dev/null

echo ""
echo "=================================================================="
echo "✅ TUDO PRONTO NO CELULAR. Faltam só 3 passos manuais (1 minuto):"
echo ""
echo "  PASSO 1: Abra github.com/new no navegador, crie um repositório"
echo "           VAZIO chamado 'kaliterm' (sem README, sem licença)."
echo ""
echo "  PASSO 2: Gere um token em github.com/settings/tokens/new"
echo "           (marque a opção 'repo'). Copie o token gerado."
echo ""
echo "  PASSO 3: Volte aqui no Termux e cole estes 3 comandos"
echo "           (troque SEU_USUARIO pelo seu usuário do GitHub):"
echo ""
echo "  cd $WORKDIR"
echo "  git remote add origin https://github.com/SEU_USUARIO/kaliterm.git"
echo "  git push -u origin main"
echo ""
echo "  Quando pedir senha, cole o TOKEN (não sua senha do GitHub)."
echo ""
echo "Depois disso, vá na aba 'Actions' do repositório no navegador,"
echo "espere ficar verde, entre no run > Artifacts > baixe o .apk"
echo "e instale no celular. Pronto, com ícone e tudo."
echo "=================================================================="
